name: Deploy WebGL to GitHub Pages

on:
  push:
    branches:
      - "**"
    paths:
      - "webgl/**"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this branch to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    name: Check WebGL build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare site
        run: |
          set -euo pipefail
          test -f webgl/index.html
          mkdir -p _site
          # Copy published build only — skip Unity debug leftover
          rsync -a \
            --exclude '*_BurstDebugInformation_DoNotShip' \
            --exclude '**/DoNotShip/**' \
            webgl/ _site/
          # GitHub Pages: treat as plain static site (no Jekyll)
          touch _site/.nojekyll

      - name: Upload prepared site
        uses: actions/upload-artifact@v5
        with:
          name: site
          path: _site
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download prepared site
        uses: actions/download-artifact@v5
        with:
          name: site
          path: _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
